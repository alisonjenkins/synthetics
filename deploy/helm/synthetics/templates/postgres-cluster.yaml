apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "synthetics.dbCluster" . }}
  labels:
    {{- include "synthetics.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.postgres.instances }}
  storage:
    size: {{ .Values.postgres.storageSize }}
  bootstrap:
    initdb:
      database: {{ .Values.postgres.database }}
      owner: {{ .Values.postgres.owner }}
