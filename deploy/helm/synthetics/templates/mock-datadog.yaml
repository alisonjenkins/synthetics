{{- if .Values.mockDatadog.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "synthetics.mockService" . }}
  labels:
    {{- include "synthetics.labels" . | nindent 4 }}
    app.kubernetes.io/component: mock-datadog
spec:
  replicas: {{ .Values.mockDatadog.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: mock-datadog
  template:
    metadata:
      labels:
        {{- include "synthetics.labels" . | nindent 8 }}
        app.kubernetes.io/component: mock-datadog
    spec:
      containers:
        - name: mock-datadog
          image: "{{ .Values.image.registry }}/{{ .Values.image.mockDatadog.repository }}:{{ .Values.image.mockDatadog.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: dogstatsd
              containerPort: 8125
              protocol: UDP
            - name: http
              containerPort: 8080
          resources:
            {{- toYaml .Values.mockDatadog.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "synthetics.mockService" . }}
  labels:
    {{- include "synthetics.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: mock-datadog
  ports:
    - name: dogstatsd
      port: 8125
      targetPort: dogstatsd
      protocol: UDP
    - name: http
      port: 8080
      targetPort: http
{{- end }}
