{{- /*
Credentials for the control plane and workers. Kept in a Secret and injected as
env vars (never CLI args), so they are not visible via `kubectl get pod -o yaml`
or /proc/<pid>/cmdline. For local/dev only; production uses OIDC + mTLS.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "synthetics.fullname" . }}-tokens
  labels:
    {{- include "synthetics.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- $pairs := list }}
  {{- range .Values.controlPlane.writerTokens }}
  {{- $pairs = append $pairs (printf "%s:%s" .token .product) }}
  {{- end }}
  writer-tokens: {{ join "," $pairs | quote }}
  worker-cp-token: {{ .Values.worker.cpToken | quote }}
