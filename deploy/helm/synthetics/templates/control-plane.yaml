apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "synthetics.cpService" . }}
  labels:
    {{- include "synthetics.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  replicas: {{ .Values.controlPlane.replicas }}
  strategy:
    {{- toYaml .Values.controlPlane.strategy | nindent 4 }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: control-plane
  template:
    metadata:
      labels:
        {{- include "synthetics.labels" . | nindent 8 }}
        app.kubernetes.io/component: control-plane
    spec:
      terminationGracePeriodSeconds: {{ .Values.controlPlane.terminationGracePeriodSeconds }}
      containers:
        - name: control-plane
          image: "{{ .Values.image.registry }}/{{ .Values.image.controlPlane.repository }}:{{ .Values.image.controlPlane.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --listen
            - {{ .Values.controlPlane.listen | quote }}
            - --log-format
            - {{ .Values.controlPlane.logFormat }}
            {{- range .Values.controlPlane.writerTokens }}
            - --writer-token
            - {{ printf "%s:%s" .token .product | quote }}
            {{- end }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "synthetics.dbCluster" . }}-app
                  key: uri
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /config/version
              port: http
              httpHeaders:
                - name: authorization
                  value: Bearer readiness
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.controlPlane.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "synthetics.cpService" . }}
  labels:
    {{- include "synthetics.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: control-plane
  ports:
    - name: http
      port: 8080
      targetPort: http
