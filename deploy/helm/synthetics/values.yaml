image:
  registry: localhost:5001
  pullPolicy: IfNotPresent
  worker:
    repository: synthetics-worker
    tag: latest
  controlPlane:
    repository: synthetics-control-plane
    tag: latest
  mockDatadog:
    repository: synthetics-mock-datadog
    tag: latest

controlPlane:
  # Two replicas by default: zero-downtime rolling upgrades and the CP PDB both
  # require >= 2. The data plane is unaffected by CP downtime regardless (workers
  # run cached config, V29) — HA is only for uninterrupted API availability.
  replicas: 2
  # Bring a new pod to Ready before removing an old one (needs replicas >= 2 to
  # be truly zero-downtime; the readiness probe gates traffic).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  # In-flight requests drain on SIGTERM (axum graceful shutdown). Measured
  # worst case: a /checks resolve of 10k endpoints is ~20ms (~100ms at 50k) —
  # there are no streaming/long-poll/long-running requests. 10s is generous
  # headroom; the pod actually exits within ~0.1s of draining, so this only
  # bounds the SIGKILL fallback for a stuck process.
  terminationGracePeriodSeconds: 10
  listen: "0.0.0.0:8080"
  logFormat: json
  # Writer credentials (token → product). For local/dev only; production uses OIDC.
  writerTokens:
    - token: dev-token
      product: web
  # Only takes effect when replicas > 1 (a PDB on a single replica blocks drains).
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  # Measured RSS ~7 MiB (Postgres pool + resolving the endpoint set in memory).
  # Grows transiently with the number of endpoints resolved per /checks; 64Mi
  # request / 256Mi limit comfortably covers tens of thousands of endpoints.
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }

worker:
  replicas: 3
  # Elastic scaling of the fleet. Rendezvous sharding reshards minimally on
  # scale events (V27). Requires metrics-server; off by default so `just up`
  # works on a bare KIND cluster.
  autoscaling:
    enabled: false
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    behavior: {}
  region: local
  logFormat: json
  pollSecs: 15
  heartbeatSecs: 10
  # Credential presented to the control plane (AcceptWorkerAuth: any non-empty).
  cpToken: worker-fleet
  # SSRF guard (#5): operator allowlist of internal CIDRs an endpoint that sets
  # allow_internal may be checked against. Empty = no internal targets permitted
  # even with the opt-in (fail closed). e.g. ["10.0.0.0/8", "192.168.0.0/16"].
  allowInternalCidrs: []
  # Cap simultaneous voluntary evictions; sharding covers individual losses (V27).
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  # DogStatsD target used when mockDatadog.enabled is false. When the mock is
  # enabled the worker points at it automatically. An unreachable target is
  # dropped gracefully (V13).
  dogstatsd: "127.0.0.1:8125"
  # Measured RSS ~25 MiB with 200 endpoints @100ms (small responses). Memory is
  # flat in endpoint count; the hard ceiling is base + max_concurrency ×
  # MAX_BODY_BYTES (2 MiB body cap) during simultaneous large-body downloads —
  # ~0.5 GiB at the default concurrency of 256. Raise the limit (or lower
  # concurrency) only for fleets monitoring many large-body endpoints.
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: "1", memory: 256Mi }

mockDatadog:
  # Local DogStatsD receiver + web viewer. Never sends to real Datadog (V39).
  enabled: true
  replicas: 1
  # Measured RSS ~7 MiB with 5000 captured metrics (the retention cap). Bounded
  # by capacity × metric size.
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 200m, memory: 64Mi }

postgres:
  # CloudNativePG-provisioned Postgres (operator installed separately).
  instances: 1
  storageSize: 1Gi
  database: synthetics
  owner: synthetics
