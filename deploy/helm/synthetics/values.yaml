image:
  registry: localhost:5001
  pullPolicy: IfNotPresent
  worker:
    repository: synthetics-worker
    tag: latest
  controlPlane:
    repository: synthetics-control-plane
    tag: latest
  mockDatadog:
    repository: synthetics-mock-datadog
    tag: latest

controlPlane:
  replicas: 1
  listen: "0.0.0.0:8080"
  logFormat: json
  # Writer credentials (token → product). For local/dev only; production uses OIDC.
  writerTokens:
    - token: dev-token
      product: web
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }

worker:
  replicas: 3
  # Elastic scaling of the fleet. Rendezvous sharding reshards minimally on
  # scale events (V27). Requires metrics-server; off by default so `just up`
  # works on a bare KIND cluster.
  autoscaling:
    enabled: false
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    behavior: {}
  region: local
  logFormat: json
  pollSecs: 15
  heartbeatSecs: 10
  # Credential presented to the control plane (AcceptWorkerAuth: any non-empty).
  cpToken: worker-fleet
  # DogStatsD target used when mockDatadog.enabled is false. When the mock is
  # enabled the worker points at it automatically. An unreachable target is
  # dropped gracefully (V13).
  dogstatsd: "127.0.0.1:8125"
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: "1", memory: 256Mi }

mockDatadog:
  # Local DogStatsD receiver + web viewer. Never sends to real Datadog (V39).
  enabled: true
  replicas: 1
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }

postgres:
  # CloudNativePG-provisioned Postgres (operator installed separately).
  instances: 1
  storageSize: 1Gi
  database: synthetics
  owner: synthetics
