[package]
name = "synthetics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "High-performance synthetic monitoring daemon (HTTP/TCP checks, hot-reloadable, DogStatsD)."

[lib]
name = "synthetics"
path = "src/lib.rs"

[[bin]]
name = "synthetics"
path = "src/main.rs"

[dependencies]
bytes = "1.12.0"
clap = { version = "4.6.1", features = ["derive"] }
http-body-util = "0.1.3"
humantime-serde = "1.1.1"
hyper = { version = "1.10.1", features = ["client", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
regex = "1.12.4"
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.11.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12", "logging"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
url = { version = "2.5.8", features = ["serde"] }
webpki-roots = "1.0.8"
x509-parser = "0.18.1"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
libc = "0.2.186"
rcgen = "0.14.8"
tokio = { version = "1.52.3", features = ["macros", "rt"] }

[[bench]]
name = "body_scan"
harness = false

[lints]
workspace = true
