[package]
name = "synthetics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "High-performance synthetic monitoring daemon (HTTP/TCP checks, hot-reloadable, DogStatsD)."

[lib]
name = "synthetics"
path = "src/lib.rs"

[[bin]]
name = "synthetics"
path = "src/main.rs"

[dependencies]
humantime-serde = "1.1.1"
regex = "1.12.4"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
toml = "1.1.2"
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]

[lints]
workspace = true
