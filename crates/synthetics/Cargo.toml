[package]
name = "synthetics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "High-performance synthetic monitoring daemon (HTTP/TCP checks, hot-reloadable, DogStatsD)."

[lib]
name = "synthetics"
path = "src/lib.rs"

[[bin]]
name = "synthetics"
path = "src/main.rs"

[dependencies]
bytes = "1.12.0"
http-body-util = "0.1.3"
humantime-serde = "1.1.1"
hyper = { version = "1.10.1", features = ["client", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
regex = "1.12.4"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["io-util", "net", "rt", "time"] }
toml = "1.1.2"
tracing = "0.1.44"
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt"] }

[lints]
workspace = true
