[package]
name = "synthetics-control-plane"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Control plane for the synthetics fleet: config hierarchy storage, resolution, and API."

[lib]
name = "synthetics_cp"
path = "src/lib.rs"

[[bin]]
name = "synthetics-cp"
path = "src/main.rs"

[dependencies]
subtle = "2.6.1"
synthetics = { path = "../synthetics" }
humantime-serde = "1.1.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "json",
] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "net", "rt", "rt-multi-thread", "signal", "sync"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "query"] }
url = "2.5.8"
regex = "1.12.4"
clap = { version = "4.6.1", features = ["derive", "env"] }
tracing = "0.1.44"

[dev-dependencies]
http-body-util = "0.1.3"
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
tokio = { version = "1.52.3", features = ["macros", "net", "rt-multi-thread", "time"] }
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
