# cargo-deny configuration (ADR 0013, V23).
# Gate the dependency tree on: license policy, security advisories, source
# provenance, and banned crates. CI runs `cargo deny check`.

[graph]
all-features = true

[advisories]
# Fail on any RUSTSEC advisory (vulnerability / unmaintained) in the tree.
version = 2
yanked = "deny"

[licenses]
# Allow-list only. Any dependency whose license is not listed fails the check —
# copyleft/toxic licenses (GPL, AGPL, LGPL, SSPL, ...) are absent and therefore
# denied by omission. SPDX identifiers.
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
]

[bans]
# Reject multiple major versions of the same crate creeping in, and wildcard
# deps. `warn` for duplicates (transitive, not always fixable); deny wildcards.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Only crates.io by default; unknown registries/git sources must be added
# explicitly here, so a typo'd or malicious source is rejected.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
